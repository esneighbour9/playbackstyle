name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate icon.ico if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "build\icon.ico")) {
            Write-Host "icon.ico not found, generating from SVG..."
            if (Test-Path "build\icon.svg") {
              npm install -g sharp-cli
              sharp -i build/icon.svg -o build/icon.ico --resize 256,128,64,48,32,16
              Write-Host "icon.ico generated successfully"
            } else {
              Write-Host "Error: icon.svg not found, cannot build installer"
              exit 1
            }
          }

      - name: Build Windows installer
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from package.json
        id: version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          echo "version=$($pkg.version)" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.version }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
