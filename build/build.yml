name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate icon.ico if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "build\icon.ico")) {
            Write-Host "icon.ico not found, generating from SVG..."
            if (Test-Path "build\icon.svg") {
              npm install -g sharp-cli
              sharp -i build/icon.svg -o build/icon.ico --resize 256,128,64,48,32,16
              Write-Host "icon.ico generated successfully"
            } else {
              Write-Host "Warning: icon.svg not found, build may fail"
            }
          }

      - name: Build main process
        run: npm run build:main

      - name: Build renderer process
        run: npm run build:renderer

      - name: Verify build output
        shell: pwsh
        run: |
          $requiredFiles = @(
            "dist\main.js",
            "dist\preload.js",
            "dist\renderer\index.html"
          )
          $allExist = $true
          foreach ($file in $requiredFiles) {
            if (Test-Path $file) {
              Write-Host "OK: $file"
            } else {
              Write-Host "MISSING: $file"
              $allExist = $false
            }
          }
          if (-not $allExist) {
            exit 1
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
